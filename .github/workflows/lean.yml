name: Noema verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Verify the Python and Lean integration
        run: |
          ELAN_TOOLCHAIN=$(cat lean/lean-toolchain)
          export ELAN_TOOLCHAIN
          python -m pytest tests/ --timeout=120
